<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MicroClimate Monitor – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <!-- Background overlay -->
  <div class="bg-overlay"></div>

  <!-- Glass card container -->
  <div class="auth-container">
    <div class="auth-card">

      <!-- Logo + Title -->
      <div class="auth-header">
        <div class="auth-logo">
          <i class="fa-solid fa-seedling"></i>
        </div>
        <h1 class="auth-title">MicroClimate Monitor</h1>
        <p class="auth-tagline">Smart Agriculture Monitoring System</p>
      </div>

      <!-- Tab toggle -->
      <div class="tab-toggle">
        <div class="tab-slider" id="tabSlider"></div>
        <button class="tab-btn active" id="tabLogin" data-tab="login">Login</button>
        <button class="tab-btn" id="tabSignup" data-tab="signup">Sign Up</button>
      </div>

      <!-- Forms wrapper -->
      <div class="forms-wrapper">

        <!-- Login form -->
        <form class="auth-form active" id="loginForm" novalidate>
          <div class="input-group">
            <span class="input-icon"><i class="fa-solid fa-envelope"></i></span>
            <input type="email" id="loginEmail" placeholder="Email address" required autocomplete="email">
          </div>

          <div class="input-group">
            <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
            <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
            <button type="button" class="toggle-password" data-target="loginPassword" aria-label="Toggle password visibility">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" id="rememberMe">
              <span class="checkmark"></span>
              Remember me
            </label>
          </div>

          <button type="submit" class="btn-submit" id="loginBtn">
            <span class="btn-text">Login</span>
            <span class="btn-loader"><i class="fa-solid fa-spinner fa-spin"></i></span>
          </button>

          <p class="form-switch">
            Don't have an account? <a href="#" id="switchToSignup">Sign up</a>
          </p>
        </form>

        <!-- Signup form -->
        <form class="auth-form" id="signupForm" novalidate>
          <div class="input-group">
            <span class="input-icon"><i class="fa-solid fa-user"></i></span>
            <input type="text" id="signupName" placeholder="Full name" required autocomplete="name">
          </div>

          <div class="input-group">
            <span class="input-icon"><i class="fa-solid fa-envelope"></i></span>
            <input type="email" id="signupEmail" placeholder="Email address" required autocomplete="email">
          </div>

          <div class="input-group">
            <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
            <input type="password" id="signupPassword" placeholder="Password" required autocomplete="new-password">
            <button type="button" class="toggle-password" data-target="signupPassword" aria-label="Toggle password visibility">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>

          <!-- Password strength indicator -->
          <div class="password-strength" id="passwordStrength">
            <div class="strength-bars">
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
            </div>
            <span class="strength-label" id="strengthLabel"></span>
          </div>

          <div class="input-group">
            <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
            <input type="password" id="signupConfirmPassword" placeholder="Confirm password" required autocomplete="new-password">
            <button type="button" class="toggle-password" data-target="signupConfirmPassword" aria-label="Toggle password visibility">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>

          <button type="submit" class="btn-submit" id="signupBtn">
            <span class="btn-text">Create Account</span>
            <span class="btn-loader"><i class="fa-solid fa-spinner fa-spin"></i></span>
          </button>

          <p class="form-switch">
            Already have an account? <a href="#" id="switchToLogin">Login</a>
          </p>
        </form>

      </div>

      <!-- Message area -->
      <div class="message-box" id="messageBox"></div>

    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
